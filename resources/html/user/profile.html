            <label>用户昵称：</label>
            <input type="text" class="p-input" value="张三 (极客数码)">
          </div>

            <label>真实姓名：</label>

          <div class="p-item">

            <span style="font-size:13px;color:#333;">138****8888 <a href="javascript:;" style="font-size:12px;color:#005ea7;margin-left:8px;">修改手机</a></span>
          </div>

            <label>安全邮箱：</label>
            <input type="email" class="p-input" value="zhangsan@example.com">
          </div>

          <div class="p-item">

            <span style="font-size:13px;color:#52c41a;font-weight:bold;">🛡️ 高级 (安全评分 95 分)</span>
          </div>

          <div style="margin-left:120px;margin-top:20px;">
            <button type="submit" class="btn-am-submit" style="padding:8px 30px;">保存修改</button>
          </div>

  <div class="toast" id="toast"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toastEl = document.getElementById('toast');
      function showToast(msg) {
        toastEl.innerText = msg;
        toastEl.className = 'toast show';
        setTimeout(() => toastEl.className = 'toast', 2500);
      }

      const form = document.getElementById('profileForm');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          showToast('✅ 个人信息已成功更新并生效！');
        });
      }
    });
  </script>
